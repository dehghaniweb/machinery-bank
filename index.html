<!DOCTYPE html><html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>بانک ماشین‌آلات شرکت</title><!-- Telegram Web App --><script src="https://telegram.org/js/telegram-web-app.js"></script><style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
}

body{
  font-family:Tahoma,Arial,sans-serif;
  background:#f3f7f4;
  color:#173c2c;
  direction:rtl;
}

button,input,select,textarea{
  font-family:inherit;
}

button{
  cursor:pointer;
}

.hidden{
  display:none!important;
}

.container{
  width:min(1100px,calc(100% - 24px));
  margin:0 auto;
}

/* ================= HEADER ================= */

.app-header{
  background:linear-gradient(135deg,#0b4b35,#176c49);
  color:#fff;
  padding:16px 0;
  box-shadow:0 3px 12px rgba(0,0,0,.12);
}

.header-inner{
  width:min(1100px,calc(100% - 24px));
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.header-title{
  font-size:20px;
  font-weight:bold;
}

.header-user{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
}

.user-name{
  font-size:13px;
}

.admin-badge{
  background:#f4c542;
  color:#4a3800;
  border-radius:20px;
  padding:4px 9px;
  font-size:11px;
  font-weight:bold;
}

.header-actions{
  display:flex;
  gap:7px;
}

.header-btn{
  border:1px solid rgba(255,255,255,.35);
  background:rgba(255,255,255,.12);
  color:#fff;
  border-radius:9px;
  padding:8px 11px;
  font-size:12px;
}

.header-btn:hover{
  background:rgba(255,255,255,.2);
}

/* ================= MAIN ================= */

main{
  padding:18px 0 35px;
}

/* ================= LOGIN ================= */

.login-page{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:linear-gradient(145deg,#eaf3ee,#f7faf8);
}

.login-card{
  width:min(420px,100%);
  background:#fff;
  border-radius:18px;
  padding:28px 24px;
  box-shadow:0 10px 35px rgba(0,0,0,.1);
}

.login-logo{
  width:70px;
  height:70px;
  margin:0 auto 15px;
  border-radius:20px;
  background:linear-gradient(135deg,#0b4b35,#27845a);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:31px;
}

.login-title{
  text-align:center;
  margin:0 0 7px;
  font-size:22px;
  color:#0b4b35;
}

.login-subtitle{
  text-align:center;
  color:#718278;
  font-size:12px;
  margin-bottom:22px;
}

/* ================= FORMS ================= */

.form-group{
  margin-bottom:13px;
}

.form-label{
  display:block;
  font-size:12px;
  margin-bottom:6px;
  color:#315646;
  font-weight:bold;
}

.form-control{
  width:100%;
  border:1px solid #d6e3dc;
  background:#fff;
  border-radius:9px;
  padding:11px 12px;
  outline:none;
  color:#173c2c;
  font-size:13px;
}

.form-control:focus{
  border-color:#27845a;
  box-shadow:0 0 0 3px rgba(39,132,90,.1);
}

textarea.form-control{
  resize:vertical;
  min-height:90px;
}

.primary-btn{
  border:0;
  background:linear-gradient(135deg,#176c49,#27845a);
  color:#fff;
  border-radius:9px;
  padding:11px 16px;
  font-size:13px;
  font-weight:bold;
  box-shadow:0 4px 10px rgba(23,108,73,.15);
}

.primary-btn:hover{
  filter:brightness(1.04);
}

.secondary-btn{
  border:1px solid #d0ded7;
  background:#fff;
  color:#315646;
  border-radius:9px;
  padding:10px 15px;
  font-size:13px;
}

.danger-btn{
  border:0;
  background:#c94a4a;
  color:#fff;
  border-radius:8px;
  padding:8px 11px;
  font-size:11px;
}

.small-btn{
  padding:7px 10px;
  font-size:11px;
}

/* ================= STATS ================= */

.stats-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:12px;
  margin-bottom:15px;
}

.stat-card{
  background:#fff;
  border:1px solid #e0ebe5;
  border-radius:13px;
  padding:15px;
  box-shadow:0 3px 10px rgba(0,0,0,.04);
}

.stat-title{
  color:#718278;
  font-size:11px;
  margin-bottom:5px;
}

.stat-value{
  color:#0b4b35;
  font-size:22px;
  font-weight:bold;
}

/* ================= SEARCH ================= */

.search-box{
  background:#fff;
  border:1px solid #e0ebe5;
  border-radius:13px;
  padding:13px;
  margin-bottom:15px;
  box-shadow:0 3px 10px rgba(0,0,0,.04);
}

.search-row{
  display:grid;
  grid-template-columns:1fr 220px;
  gap:10px;
}

.search-input{
  width:100%;
  border:1px solid #d6e3dc;
  border-radius:9px;
  padding:11px 13px;
  outline:none;
  font-size:13px;
}

.search-input:focus{
  border-color:#27845a;
}

.select-control{
  width:100%;
  border:1px solid #d6e3dc;
  border-radius:9px;
  padding:10px;
  background:#fff;
  color:#173c2c;
  outline:none;
}

/* ================= SECTION ================= */

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:16px 0 10px;
}

.section-title h2{
  margin:0;
  font-size:16px;
  color:#0b4b35;
}

.section-count{
  color:#718278;
  font-size:11px;
}

/* ================= MACHINES ================= */

.machine-list{
  display:grid;
  grid-template-columns:1fr;
  gap:10px;
}

.machine-card{
  background:#fff;
  border:1px solid #e0ebe5;
  border-radius:13px;
  padding:14px;
  box-shadow:0 3px 10px rgba(0,0,0,.04);
}

.machine-top{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
}

.machine-type{
  font-weight:bold;
  color:#0b4b35;
  font-size:15px;
}

.machine-company{
  margin-top:5px;
  font-size:12px;
  color:#536a5e;
}

.machine-company strong{
  color:#173c2c;
}

.machine-info{
  display:flex;
  flex-wrap:wrap;
  gap:7px;
  margin-top:12px;
}

.info-pill{
  background:#f1f7f3;
  border:1px solid #dcebe2;
  color:#315646;
  padding:6px 9px;
  border-radius:20px;
  font-size:11px;
}

.machine-actions{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
  margin-top:12px;
}

.note-btn{
  border:0;
  background:#e8f4ed;
  color:#176c49;
  border-radius:8px;
  padding:7px 10px;
  font-size:11px;
}

.edit-btn{
  border:0;
  background:#eef3f7;
  color:#486274;
  border-radius:8px;
  padding:7px 10px;
  font-size:11px;
}

.empty-state{
  background:#fff;
  border:1px dashed #cfded6;
  border-radius:13px;
  padding:30px 15px;
  text-align:center;
  color:#718278;
  font-size:13px;
}

.loading-state{
  text-align:center;
  padding:30px;
  color:#718278;
  font-size:13px;
}

/* ================= ADMIN PANEL ================= */

#adminPanel{
  background:#fff;
  border:1px solid #dce9e2;
  border-radius:14px;
  margin-top:22px;
  margin-bottom:15px;
  box-shadow:0 4px 13px rgba(0,0,0,.05);
  padding:0;
  overflow:hidden;
}

#adminPanel .admin-panel-header{
  width:100%;
  border:0;
  background:#fff;
  color:#0b4b35;
  padding:14px 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  cursor:pointer;
  text-align:right;
}

#adminPanel .admin-panel-header:hover{
  background:#f8fbf9;
}

.admin-panel-header-title{
  display:flex;
  align-items:center;
  gap:9px;
  font-weight:bold;
  font-size:14px;
}

.admin-panel-header-icon{
  width:30px;
  height:30px;
  border-radius:9px;
  background:#e8f4ed;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:16px;
}

.admin-panel-arrow{
  transition:.2s;
  font-size:15px;
  color:#718278;
}

#adminPanel.open .admin-panel-arrow{
  transform:rotate(180deg);
}

#adminPanel .admin-panel-content{
  display:none;
  border-top:1px solid #edf2ef;
  padding:16px;
}

#adminPanel.open .admin-panel-content{
  display:block;
}

.admin-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:11px;
}

.admin-grid .full{
  grid-column:1/-1;
}

.admin-actions{
  display:flex;
  gap:8px;
  margin-top:5px;
}

.admin-panel{
  background:#f8fbf9;
  border:1px solid #dce9e2;
  border-radius:11px;
  padding:14px;
}

/* ================= DATE PICKER ================= */

.date-picker-wrap{
  position:relative;
  width:100%;
}

.date-display{
  min-height:58px;
  width:100%;
  border:1px solid #d6e3dc;
  background:#fff;
  border-radius:9px;
  padding:8px 42px 8px 12px;
  display:flex;
  flex-direction:column;
  justify-content:center;
  cursor:pointer;
  position:relative;
}

.date-display:hover{
  border-color:#27845a;
}

.date-jalali{
  font-size:13px;
  color:#176c49;
  font-weight:bold;
  line-height:1.7;
}

.date-gregorian{
  font-size:10px;
  color:#7b8b83;
  direction:ltr;
  text-align:left;
  line-height:1.5;
}

.native-date-input{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  opacity:0;
  cursor:pointer;
  z-index:2;
}

.date-calendar-icon{
  position:absolute;
  right:13px;
  top:50%;
  transform:translateY(-50%);
  font-size:18px;
  color:#27845a;
  pointer-events:none;
  z-index:3;
}

/* ================= REPORT ================= */

.report-controls{
  display:grid;
  grid-template-columns:1fr 1fr auto;
  gap:9px;
  align-items:end;
}

.report-date-box{
  min-width:0;
}

.report-date-box label{
  display:block;
  margin-bottom:6px;
  font-size:11px;
  color:#315646;
  font-weight:bold;
}

.report-list{
  margin-top:15px;
  display:grid;
  gap:8px;
}

.report-item{
  background:#fff;
  border:1px solid #e0ebe5;
  border-radius:10px;
  padding:11px;
}

.report-date{
  color:#176c49;
  font-size:11px;
  font-weight:bold;
}

.report-title{
  margin-top:5px;
  font-size:13px;
  font-weight:bold;
  color:#173c2c;
}

.report-meta{
  margin-top:5px;
  color:#718278;
  font-size:11px;
}

.report-note{
  margin-top:8px;
  color:#3d5147;
  font-size:12px;
  line-height:1.8;
  white-space:pre-wrap;
}

/* ================= MODAL ================= */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.48);
  z-index:1000;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:12px;
}

.modal-card{
  width:min(1000px,100%);
  max-height:calc(100vh - 24px);
  overflow:auto;
  background:#fff;
  border-radius:16px;
  box-shadow:0 15px 50px rgba(0,0,0,.25);
}

.modal-header{
  position:sticky;
  top:0;
  z-index:5;
  background:linear-gradient(135deg,#0b4b35,#176c49);
  color:#fff;
  padding:13px 15px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.modal-title{
  font-size:15px;
  font-weight:bold;
}

.modal-close{
  border:0;
  background:rgba(255,255,255,.14);
  color:#fff;
  width:34px;
  height:34px;
  border-radius:9px;
  font-size:20px;
  line-height:1;
}

.modal-body{
  padding:16px;
}

.notes-list{
  display:grid;
  gap:9px;
  margin-bottom:15px;
}

.note-item{
  border:1px solid #e0ebe5;
  border-radius:11px;
  padding:11px;
  background:#fff;
}

.note-item-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.note-date{
  color:#176c49;
  font-size:11px;
  font-weight:bold;
}

.note-delete{
  border:0;
  background:#fff0f0;
  color:#c94a4a;
  border-radius:7px;
  padding:5px 8px;
  font-size:10px;
}

.note-text{
  margin-top:7px;
  color:#42584c;
  font-size:12px;
  line-height:1.8;
  white-space:pre-wrap;
}

.modal-footer{
  display:flex;
  gap:8px;
  justify-content:flex-start;
  margin-top:15px;
}

/* ================= TOAST ================= */

.toast-container{
  position:fixed;
  left:15px;
  bottom:15px;
  z-index:3000;
  display:flex;
  flex-direction:column;
  gap:7px;
}

.toast{
  background:#173c2c;
  color:#fff;
  border-radius:10px;
  padding:10px 14px;
  box-shadow:0 6px 20px rgba(0,0,0,.2);
  font-size:12px;
  animation:toastIn .25s ease;
  max-width:320px;
}

.toast.success{
  background:#176c49;
}

.toast.error{
  background:#a63e3e;
}

@keyframes toastIn{
  from{
    transform:translateY(10px);
    opacity:0;
  }
  to{
    transform:translateY(0);
    opacity:1;
  }
}

/* ================= RESPONSIVE ================= */

@media(max-width:700px){

  .header-inner{
    align-items:flex-start;
  }

  .header-title{
    font-size:16px;
  }

  .header-user{
    justify-content:flex-end;
  }

  .stats-grid{
    gap:7px;
  }

  .stat-card{
    padding:11px 8px;
  }

  .stat-value{
    font-size:18px;
  }

  .search-row{
    grid-template-columns:1fr;
  }

  .admin-grid{
    grid-template-columns:1fr;
  }

  .admin-grid .full{
    grid-column:auto;
  }

  .report-controls{
    grid-template-columns:1fr 1fr;
  }

  .report-controls button{
    grid-column:1/-1;
  }

  .modal{
    padding:0;
    align-items:flex-end;
  }

  .modal-card{
    max-height:94vh;
    border-radius:16px 16px 0 0;
  }
}

@media(max-width:480px){

  .header-inner{
    flex-direction:column;
  }

  .header-actions{
    width:100%;
  }

  .header-btn{
    flex:1;
  }

  .stats-grid{
    grid-template-columns:repeat(3,1fr);
  }

  .stat-title{
    font-size:9px;
  }

  .stat-value{
    font-size:16px;
  }

  .machine-card{
    padding:12px;
  }

  .machine-top{
    flex-direction:column;
  }

  .report-controls{
    grid-template-columns:1fr;
  }

  .report-controls button{
    grid-column:auto;
  }

  .modal-body{
    padding:12px;
  }
}

/* =========================================================

function isTelegramWebApp(){

  return !!(
    window.Telegram &&
    window.Telegram.WebApp &&
    window.Telegram.WebApp.initData
  );
}


function prepareTelegramWebApp(){

  if(!window.Telegram || !window.Telegram.WebApp){
    return;
  }

  try{

    Telegram.WebApp.ready();
    Telegram.WebApp.expand();

    if(Telegram.WebApp.setHeaderColor){
      Telegram.WebApp.setHeaderColor("#0b4b35");
    }

    if(Telegram.WebApp.setBackgroundColor){
      Telegram.WebApp.setBackgroundColor("#f3f7f4");
    }

  }catch(error){

    console.warn(
      "Telegram WebApp initialization error:",
      error
    );
  }
}


async function loginWithTelegram(){

  if(!isTelegramWebApp()){
    return false;
  }

  try{

    prepareTelegramWebApp();

    const initData =
      Telegram.WebApp.initData;

    if(!initData){

      throw new Error(
        "اطلاعات ورود تلگرام دریافت نشد."
      );
    }

    const response =
      await fetch(
        API_BASE + "/api/auth/telegram",
        {
          method:"POST",
          headers:{
            "Content-Type":"application/json"
          },
          body:JSON.stringify({
            initData
          })
        }
      );

    let data = {};

    try{

      data =
        await response.json();

    }catch{

      data = {};
    }

    if(!response.ok){

      throw new Error(
        data?.error ||
        data?.message ||
        "ورود با تلگرام انجام نشد."
      );
    }

    sessionToken =
      data.session_token ||
      data.token ||
      "";

    if(!sessionToken){

      throw new Error(
        "توکن ورود تلگرام دریافت نشد."
      );
    }

    localStorage.setItem(
      "machinery_session",
      sessionToken
    );

    currentUser =
      data.user || null;

    showApp();

    await loadData();

    return true;

  }catch(error){

    console.error(
      "Telegram login error:",
      error
    );

    toast(
      translateError(error),
      "error"
    );

    return false;
  }
}

/* =========================================================
   API
========================================================= */

async function apiFetch(path, options = {}){

  const headers = {
    "Content-Type":"application/json",
    ...(options.headers || {})
  };

  if(sessionToken){

    headers.Authorization =
      "Bearer " + sessionToken;
  }

  const response =
    await fetch(
      API_BASE + path,
      {
        ...options,
        headers
      }
    );

  let data = null;

  try{

    data =
      await response.json();

  }catch{

    data = {};
  }

  if(!response.ok){

    const error =
      new Error(
        data?.error ||
        data?.message ||
        "خطا در ارتباط با سرور"
      );

    error.status =
      response.status;

    throw error;
  }

  return data;
}


/* =========================================================
   ERROR
========================================================= */

function translateError(error){

  const message =
    String(
      error?.message ||
      error ||
      ""
    );

  if(
    message.includes("Invalid credentials") ||
    message.includes("invalid credentials")
  ){

    return "نام کاربری یا رمز عبور اشتباه است.";
  }

  if(
    message.includes("Unauthorized") ||
    message.includes("unauthorized")
  ){

    return "نشست شما منقضی شده است. دوباره وارد شوید.";
  }

  if(
    message.includes("already exists")
  ){

    return "این اطلاعات قبلاً ثبت شده است.";
  }

  if(
    message.includes("not found")
  ){

    return "رکورد موردنظر پیدا نشد.";
  }

  return message || "خطای نامشخص";
}

/* =========================================================
   NUMBER
========================================================= */

function toPersianNumber(value){

  return String(value).replace(
    /\d/g,
    d => "۰۱۲۳۴۵۶۷۸۹"[d]
  );
}


/* =========================================================
   DATE
========================================================= */

function todayISO(){

  const d =
    new Date();

  const y =
    d.getFullYear();

  const m =
    String(
      d.getMonth()+1
    ).padStart(2,"0");

  const day =
    String(
      d.getDate()
    ).padStart(2,"0");

  return `${y}-${m}-${day}`;
}


function formatDate(value){

  if(!value) return "-";

  const parts =
    String(value).split("-");

  if(parts.length !== 3){
    return value;
  }

  return toPersianNumber(
    `${parts[2]}/${parts[1]}/${parts[0]}`
  );
}


/* =========================================================
   GREGORIAN -> JALALI
========================================================= */

function gregorianToJalali(
  gy,
  gm,
  gd
){

  const gdm = [
    0,
    31,
    59,
    90,
    120,
    151,
    181,
    212,
    243,
    273,
    304,
    334
  ];

  let jy;

  if(gy > 1600){

    jy = 979;
    gy -= 1600;

  }else{

    jy = 0;
    gy -= 621;
  }

  const gy2 =
    gm > 2
      ? gy + 1
      : gy;

  let days =
      365 * gy
    + Math.floor((gy2 + 3) / 4)
    - Math.floor((gy2 + 99) / 100)
    + Math.floor((gy2 + 399) / 400)
    - 80
    + gd
    + gdm[gm - 1];

  jy +=
    33 *
    Math.floor(
      days / 12053
    );

  days %= 12053;

  jy +=
    4 *
    Math.floor(
      days / 1461
    );

  days %= 1461;

  if(days > 365){

    jy +=
      Math.floor(
        (days - 1) / 365
      );

    days =
      (days - 1) % 365;
  }

  let jm;

  if(days < 186){

    jm =
      1 +
      Math.floor(
        days / 31
      );

  }else{

    jm =
      7 +
      Math.floor(
        (days - 186) / 30
      );
  }

  const jd =
    1 +
    (
      days < 186
        ? days % 31
        : (days - 186) % 30
    );

  return [
    jy,
    jm,
    jd
  ];
}


function formatJalaliDate(
  isoDate
){

  if(!isoDate) return "-";

  const parts =
    String(isoDate).split("-");

  if(parts.length !== 3){
    return "-";
  }

  const gy =
    Number(parts[0]);

  const gm =
    Number(parts[1]);

  const gd =
    Number(parts[2]);

  if(
    !gy ||
    !gm ||
    !gd
  ){

    return "-";
  }

  const [
    jy,
    jm,
    jd
  ] =
    gregorianToJalali(
      gy,
      gm,
      gd
    );

  return toPersianNumber(
    `${jy}/${String(jm).padStart(2,"0")}/${String(jd).padStart(2,"0")}`
  );
}


function updateDateDisplay(

    );

  const gregorian =
    document.getElementById(
      gregorianId
    );

  if(!input) return;

  const value =
    input.value;

  if(!value){

    if(jalali){

      jalali.textContent =
        "انتخاب تاریخ";
    }

    if(gregorian){

      gregorian.textContent =
        "";
    }

    return;
  }

  if(jalali){

    jalali.textContent =
      formatJalaliDate(value);
  }

  if(gregorian){

    gregorian.textContent =
      formatDate(value);
  }
}


function bindDatePicker(
  inputId,
  jalaliId,
  gregorianId
){

  const input =
    document.getElementById(
      inputId
    );

  if(!input) return;

  const handler =
    () =>
      updateDateDisplay(
        inputId,
        jalaliId,
        gregorianId
      );

  input.addEventListener(
    "change",
    handler
  );

  input.addEventListener(
    "input",
    handler
  );

  handler();
}

async function loadData(){

  try{

    const [
      machinesData,
      yardsData
    ] =
      await Promise.all([
        apiFetch("/api/machines"),
        apiFetch("/api/yards")
      ]);

    machines =
      Array.isArray(machinesData)
        ? machinesData
        : (
          machinesData?.machines ||
          machinesData?.data ||
          []
        );

    yards =
      Array.isArray(yardsData)
        ? yardsData
        : (
          yardsData?.yards ||
          yardsData?.data ||
          []
        );

    renderYards();

    renderMachines();

  }catch(error){

    machineList.innerHTML =
      `<div class="empty-state">
        ${escapeHtml(
          translateError(error)
        )}
      </div>`;

    toast(
      translateError(error),
      "error"
    );
  }
}


/* =========================================================
   YARDS
========================================================= */

function renderYards(){

  yardFilter.innerHTML =
    `<option value="">همه یاردها</option>`;

  machineYard.innerHTML =
    `<option value="">انتخاب یارد</option>`;

  yards.forEach(yard=>{

    const id =
      yard.id;

    const name =
      yard.name || "";

    yardFilter.insertAdjacentHTML(
      "beforeend",
      `
      <option value="${escapeAttr(id)}">
        ${escapeHtml(name)}
      </option>
      `
    );

    machineYard.insertAdjacentHTML(
      "beforeend",
      `
      <option value="${escapeAttr(id)}">
        ${escapeHtml(name)}
      </option>
      `
    );
  });

  yardCount.textContent =
    toPersianNumber(
      yards.length
    );
}


/* =========================================================
   FIND YARD
========================================================= */

function getYardName(
  yardId,
  fallback
){

  const yard =
    yards.find(
      y =>
        String(y.id) ===
        String(yardId)
    );

  return (
    yard?.name ||
    fallback ||
    "-"
  );
}


/* =========================================================
   RENDER MACHINES
========================================================= */

function renderMachines(){

  const search =
    String(
      searchInput.value || ""
    )
    .trim()
    .toLowerCase();

  const selectedYard =
    yardFilter.value;

  const filtered =
    machines.filter(machine=>{

      const type =
        String(
          machine.type || ""
        ).toLowerCase();

      const company =
        String(
          machine.company_number || ""
        ).toLowerCase();

      const plate =
        String(
          machine.plate || ""
        ).toLowerCase();

      const yardName =
        String(
          machine.yard_name ||
          getYardName(
            machine.yard_id
          ) ||
          ""
        ).toLowerCase();

      const searchMatch =
        !search ||
        type.includes(search) ||
        company.includes(search) ||
        plate.includes(search) ||
        yardName.includes(search);

      const yardMatch =
        !selectedYard ||
        String(machine.yard_id) ===
        String(selectedYard);

      return (
        searchMatch &&
        yardMatch
      );
    });

  totalMachines.textContent =
    toPersianNumber(
      machines.length
    );

  filteredMachines.textContent =
    toPersianNumber(
      filtered.length
    );

  machineCountText.textContent =
    toPersianNumber(
      `${filtered.length} ماشین`
    );

  if(!filtered.length){

    machineList.innerHTML =
      `
      <div class="empty-state">
        ماشینی با این مشخصات پیدا نشد.
      </div>
      `;

    return;
  }

  machineList.innerHTML =
    filtered
      .map(renderMachineCard)
      .join("");
}

/* =========================================================
   ADD / EDIT MACHINE
========================================================= */

async function saveMachineData(){

  if(currentUser?.role !== "admin"){
    return;
  }

  const type =
    machineType.value.trim();

  const company =
    companyNumber.value.trim();

  const yardId =
    machineYard.value;

  const plate =
    machinePlate.value.trim();

  if(!type){

    toast(
      "نوع ماشین را وارد کنید.",
      "error"
    );

    machineType.focus();

    return;
  }

  if(!company){

    toast(
      "شماره شرکت را وارد کنید.",
      "error"
    );

    companyNumber.focus();

    return;
  }

  if(!yardId){

    toast(
      "یارد را انتخاب کنید.",
      "error"
    );

    machineYard.focus();

    return;
  }

  const payload = {
    type,
    company_number:company,
    yard_id:yardId,
    plate
  };

  try{

    saveMachine.disabled =
      true;

    if(editingMachineId){

      await apiFetch(
        "/api/machines/" +
        encodeURIComponent(
          editingMachineId
        ),
        {
          method:"PATCH",
          body:JSON.stringify(
            payload
          )
        }
      );

      toast(
        "اطلاعات ماشین با موفقیت ویرایش شد.",
        "success"
      );

    }else{

      await apiFetch(
        "/api/machines",
        {
          method:"POST",
          body:JSON.stringify(
            payload
          )
        }
      );

      toast(
        "ماشین با موفقیت اضافه شد.",
        "success"
      );
    }

    clearMachineForm();

    await loadData();

  }catch(error){

    toast(
      translateError(error),
      "error"
    );

  }finally{

    saveMachine.disabled =
      false;
  }
}


function editMachine(id){

  if(currentUser?.role !== "admin"){
    return;
  }

  const machine =
    machines.find(
      m =>
        String(m.id) ===
        String(id)
    );

  if(!machine){

    toast(
      "ماشین پیدا نشد.",
      "error"
    );

    return;
  }

  editingMachineId =
    id;

  machineType.value =
    machine.type || "";

  companyNumber.value =
    machine.company_number || "";

  machineYard.value =
    machine.yard_id || "";

  machinePlate.value =
    machine.plate || "";

  adminPanelTitle.textContent =
    "ویرایش ماشین";

  saveMachine.textContent =
    "ذخیره تغییرات";

  cancelEdit.classList.remove(
    "hidden"
  );

  adminPanel.classList.add(
    "open"
  );

  setTimeout(()=>{

    adminPanel.scrollIntoView({
      behavior:"smooth",
      block:"start"
    });

  },50);
}


function clearMachineForm(){

  editingMachineId =
    null;

  machineType.value =
    "";

  companyNumber.value =
    "";

  machineYard.value =
    "";

  machinePlate.value =
    "";

  adminPanelTitle.textContent =
    "افزودن ماشین";

  saveMachine.textContent =
    "افزودن ماشین";

  cancelEdit.classList.add(
    "hidden"
  );
}


async function deleteMachine(id){

  if(currentUser?.role !== "admin"){
    return;
  }

  const machine =
    machines.find(
      m =>
        String(m.id) ===
        String(id)
    );

  if(!machine){
    return;
  }

  const confirmed =
    confirm(
      `آیا از حذف ماشین «${machine.type || ""} - ${machine.company_number || ""}» مطمئن هستید؟`
    );

  if(!confirmed){
    return;
  }

  try{

    await apiFetch(
      "/api/machines/" +
      encodeURIComponent(id),
      {
        method:"DELETE"
      }
    );

    toast(
      "ماشین با موفقیت حذف شد.",
      "success"
    );

    if(
      String(editingMachineId) ===
      String(id)
    ){

      clearMachineForm();
    }

    await loadData();

  }catch(error){

    toast(
      translateError(error),
      "error"
    );
  }
}

async function saveNote(){

if(currentUser?.role !== "admin"){
return;
}

const machineId =
currentNotesMachineId;

const noteDate =
document.getElementById(
"noteDate"
)?.value;

const noteText =
document.getElementById(
"noteText"
)?.value.trim();

if(!machineId){

toast(
  "ماشین مشخص نیست.",
  "error"
);

return;

}

if(!noteDate){

toast(
  "تاریخ را انتخاب کنید.",
  "error"
);

return;

}

if(!noteText){

toast(
  "توضیحات سابقه را وارد کنید.",
  "error"
);

return;

}

const button =
document.getElementById(
"saveNote"
);

try{

if(button){
  button.disabled = true;
}

await apiFetch(
  "/api/notes",
  {
    method:"POST",
    body:JSON.stringify({
      machine_id:machineId,
      note_date:noteDate,
      note:noteText
    })
  }
);

toast(
  "سابقه با موفقیت ثبت شد.",
  "success"
);

await showMachineNotes(
  machineId
);

}catch(error){

toast(
  translateError(error),
  "error"
);

}finally{

if(button){
  button.disabled = false;
}

}
}

async function deleteNote(
noteId
){

if(currentUser?.role !== "admin"){
return;
}

const confirmed =
confirm(
"آیا از حذف این سابقه مطمئن هستید؟"
);

if(!confirmed){
return;
}

const machineId =
currentNotesMachineId;

try{

await apiFetch(
  "/api/notes/" +
  encodeURIComponent(noteId),
  {
    method:"DELETE"
  }
);

toast(
  "سابقه حذف شد.",
  "success"
);

if(machineId){

  await showMachineNotes(
    machineId
  );

}else{

  closeModal();
}

}catch(error){

toast(
  translateError(error),
  "error"
);

}
}

async function loadReport(){

const from =
document.getElementById(
"reportFrom"
)?.value;

const to =
document.getElementById(
"reportTo"
)?.value;

const result =
document.getElementById(
"reportResults"
);

if(!result){
return;
}

if(!from || !to){

result.innerHTML =
  `
  <div class="empty-state">
    تاریخ شروع و پایان را انتخاب کنید.
  </div>
  `;

return;

}

if(from > to){

result.innerHTML =
  `
  <div class="empty-state">
    تاریخ شروع نمی‌تواند بعد از تاریخ پایان باشد.
  </div>
  `;

return;

}

result.innerHTML =
"<div class="loading-state"> در حال دریافت گزارش... </div>";

try{

const data =
  await apiFetch(
    "/api/notes?from=" +
    encodeURIComponent(from) +
    "&to=" +
    encodeURIComponent(to)
  );

const notes =
  Array.isArray(data)
    ? data
    : (
      data?.notes ||
      data?.data ||
      []
    );

if(!notes.length){

  result.innerHTML =
    `
    <div class="empty-state">
      در این بازه سابقه‌ای ثبت نشده است.
    </div>
    `;

  return;
}


result.innerHTML =
  notes
    .map(note=>{

      const machine =
        machines.find(
          m =>
            String(m.id) ===
            String(note.machine_id)
        );

      const machineTypeValue =
        note.machine_type ||
        machine?.type ||
        "-";

      const company =
        note.company_number ||
        machine?.company_number ||
        "-";

      const yard =
        note.yard_name ||
        getYardName(
          note.yard_id ||
          machine?.yard_id
        );


      return `
        <div class="report-item">

          <div class="report-date">
            📅 ${formatDate(
              note.note_date
            )}
          </div>

          <div class="report-title">
            ${escapeHtml(
              machineTypeValue
            )}
          </div>

          <div class="report-meta">
            شماره شرکت:
            ${escapeHtml(company)}
            &nbsp; | &nbsp;
            یارد:
            ${escapeHtml(yard)}
          </div>

          <div class="report-note">
            ${escapeHtml(
              note.note || ""
            )}
          </div>

        </div>
      `;

    })
    .join("");

}catch(error){

result.innerHTML =
  `
  <div class="empty-state">
    ${escapeHtml(
      translateError(error)
    )}
  </div>
  `;

toast(
  translateError(error),
  "error"
);

}
}

/* =========================================================
ESCAPE
========================================================= */

function escapeHtml(
value
){

return String(
value ?? ""
)
.replace(
/&/g,
"&"
)
.replace(
/</g,
"<"
)
.replace(
/>/g,
">"
)
.replace(
/"/g,
"""
)
.replace(
/'/g,
"'"
);
}

function escapeAttr(
value
){

return escapeHtml(
value
);
}
